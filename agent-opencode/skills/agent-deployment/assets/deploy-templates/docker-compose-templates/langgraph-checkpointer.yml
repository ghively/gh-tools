# LangGraph with durable Postgres checkpointer.
# Pair with the LangGraph Dockerfile in framework-deploy-matrix.md.

services:
  langgraph-agent:
    build: .
    container_name: langgraph-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Provider
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${ZAI_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      # LangGraph checkpointer
      CHECKPOINTER_DB: postgresql+psycopg://langgraph:${PGPASSWORD}@postgres:5432/langgraph
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: langgraph-agent
      LANGSMITH_TRACING: "true"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    volumes:
      - ./workspace:/workspace
      - agent-data:/data
    working_dir: /workspace
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: langgraph-checkpointer
    restart: unless-stopped
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: langgraph
    volumes:
      - pg-data:/var/lib/postgresql/data
      # WAL archiving for point-in-time recovery
      - pg-wal:/var/lib/postgresql/wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

volumes:
  pg-data: {}
  pg-wal: {}
  agent-data: {}
