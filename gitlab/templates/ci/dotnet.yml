# .NET — test (with JUnit + Cobertura coverage) and publish release bits.
default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

stages: [test, publish]

.rules: &rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:
  stage: test
  script:
    - dotnet test --configuration Release --logger "junit" --collect:"XPlat Code Coverage"
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
    expire_in: 1 week
  rules: *rules

publish:
  stage: publish
  script:
    - dotnet publish --configuration Release --output out/
  artifacts:
    paths: [out/]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
