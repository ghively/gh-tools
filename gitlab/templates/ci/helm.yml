# Helm — lint every chart in charts/* and package the .tgz on default branch + tags.
# Push to the GitLab Helm registry by adding:
#   helm repo add --username gitlab-ci-token --password $CI_JOB_TOKEN ${CI_PROJECT_NAME} ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable
#   helm cm-push packages/*.tgz ${CI_PROJECT_NAME}
stages: [test, package]

lint:
  stage: test
  image: alpine/helm:3.14
  script:
    - for chart in charts/*; do echo "== $chart =="; helm lint "$chart"; done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:
  stage: package
  image: alpine/helm:3.14
  script:
    - mkdir -p packages
    - for chart in charts/*; do helm package "$chart" -d packages; done
  artifacts:
    paths: [packages/*.tgz]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
