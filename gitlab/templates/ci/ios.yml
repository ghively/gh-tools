# iOS (Fastlane) — run tests via Fastlane, build on default branch + tags.
# Requires a macOS runner with Xcode + Fastlane installed (tags: [macos, xcode]).
default:
  tags: [macos, xcode]

stages: [test, build]

.rules: &rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:
  stage: test
  script:
    - fastlane test
  artifacts:
    when: always
    reports:
      junit: fastlane/test_output/*.junit
    paths: [fastlane/test_output/]
    expire_in: 1 week
  rules: *rules

build:
  stage: build
  script:
    - fastlane build
  artifacts:
    paths: [fastlane/build/]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
