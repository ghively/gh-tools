# Rust — fmt (advisory), clippy (strict), test, release build. Cargo cache per Cargo.lock.
default:
  image: rust:1.82-slim
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo/registry/, .cargo/git/, target/]

stages: [test, build]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.rules: &rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

fmt:
  stage: test
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  allow_failure: true
  rules: *rules

clippy:
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings
  rules: *rules

test:
  stage: test
  script:
    - cargo test --verbose
  rules: *rules

build:
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths: [target/release/]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
