# Scala (sbt) — compile, scalafmt check (advisory), test, assembly.
default:
  image: sbtscala/scala-sbt:eclipse-temurin-21_8_1.10.7_2.13.16
  cache:
    key:
      files: [build.sbt]
    paths: [.cache/coursier/, .sbt/, target/]

stages: [test, build]

variables:
  COURSIER_CACHE: "$CI_PROJECT_DIR/.cache/coursier"
  SBT_OPTS: "-Dsbt.global.base=$CI_PROJECT_DIR/.sbt"

.rules: &rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

scalafmt:
  stage: test
  script:
    - sbt scalafmtCheckAll
  allow_failure: true
  rules: *rules

test:
  stage: test
  script:
    - sbt test
  rules: *rules

package:
  stage: build
  script:
    - sbt assembly
  artifacts:
    paths: [target/*.jar]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
